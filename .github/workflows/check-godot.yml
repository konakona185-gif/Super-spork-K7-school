name: Godot - Controllo progetto

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-project:
    name: Verifica progetto Godot 4.4
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica Godot 4.4
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.4-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Controlla il motore Action Bar
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --check-only --script res://scripts/combat_manager.gd 2>&1 | tee combat-manager.log

          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' combat-manager.log; then
            echo "Errore nel motore Action Bar."
            exit 1
          fi

      - name: Esegui i test del combattimento
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/test_combat_manager.gd 2>&1 | tee combat-tests.log

          if grep -E 'SCRIPT ERROR:|Parse Error:|TEST FALLITO:|TEST COMBAT MANAGER: [0-9]+ TEST FALLITI|ERROR:' combat-tests.log; then
            echo "I test del combattimento non sono stati superati."
            exit 1
          fi

          if ! grep -q 'TEST COMBAT MANAGER: TUTTI I TEST SUPERATI' combat-tests.log; then
            echo "Il risultato dei test non è stato confermato."
            exit 1
          fi

      - name: Avvia la scena principale
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 5 2>&1 | tee godot-run.log

          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|No loader found for resource|Cannot open file' godot-run.log; then
            echo "Errore durante l'avvio della scena."
            exit 1
          fi
