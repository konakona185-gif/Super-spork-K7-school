
name: Godot - Controllo progetto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-project:
    name: Verifica progetto Godot 4.4
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica Godot 4.4
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          echo "$PWD/Godot_v4.4-stable_linux.x86_64" >> "$GITHUB_PATH"

      - name: Controlla progetto e script
        shell: bash
        run: |
          set -o pipefail
          godot_bin="$RUNNER_WORKSPACE/$GITHUB_REPOSITORY/Godot_v4.4-stable_linux.x86_64"

          "$godot_bin" --headless --editor --path . --quit 2>&1 | tee godot-editor.log

          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' godot-editor.log; then
            echo "Sono stati rilevati errori nel progetto."
            exit 1
          fi

      - name: Prova ad avviare la scena
        shell: bash
        run: |
          set -o pipefail
          godot_bin="$RUNNER_WORKSPACE/$GITHUB_REPOSITORY/Godot_v4.4-stable_linux.x86_64"

          "$godot_bin" --headless --path . --quit-after 3 2>&1 | tee godot-run.log

          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' godot-run.log; then
            echo "La scena ha segnalato errori."
            exit 1
          fi
